<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD Signage</title>
    <style>
        html {
            background-color: black;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            max-height: 100%;
            min-width: 100%;
        }
    </style>
</head>

<body>

    <video id="video" autoplay muted></video>

    <script>
        const videoSources = [
            // "https://github.com/wdd-licensing-signage/wdd-signage-videos/raw/refs/heads/main/videos/Diamond_Presentation.mp4",
            // "https://github.com/wdd-licensing-signage/wdd-signage-videos/raw/refs/heads/main/videos/InStoreScreens-Fashion-Jan2024.mp4",
            // "https://github.com/wdd-licensing-signage/wdd-signage-videos/raw/refs/heads/main/videos/InStoreScreens-Tierra-Jan2024.mp4",
            // "https://github.com/wdd-licensing-signage/wdd-signage-videos/raw/refs/heads/main/videos/Mothers Day Presentation.mp4",
            "https://github.com/wdd-licensing-signage/wdd-signage-videos/raw/refs/heads/main/videos/0608.mp4"
        ];

        var activeVideo = 0; //Start with first video

        const videoElm = document.getElementById("video");

        videoElm.src = videoSources[activeVideo];
        videoElm.addEventListener("ended", () => {
            activeVideo = ++activeVideo % videoSources.length;
            videoElm.src = videoSources[activeVideo];
        });
    </script>
</body>

</html>
